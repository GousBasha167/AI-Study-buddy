<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Materials · Learn Mate AI</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <script>try { document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") === "light" ? "light" : "dark"); } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }</script>
</head>
<body>
  <main id="main" class="content">
    <div class="page-head">
      <div>
        <p class="eyebrow">Library</p>
        <h1 class="page-title">Study Materials</h1>
        <p class="page-sub">Upload, search and manage your study files.</p>
      </div>
    </div>

    <div id="msg" class="msg hidden" role="alert"></div>

    <div class="materials-layout">
      <div class="library">
        <div class="toolbar">
          <label class="search" for="search-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="search-input" placeholder="Search by title or file name..." aria-label="Search materials" />
          </label>
          <div class="chips" role="group" aria-label="Filter materials">
            <button type="button" class="chip active" data-filter="all">All</button>
            <button type="button" class="chip" data-filter="summarized">Summarized</button>
            <button type="button" class="chip" data-filter="unsummarized">Not summarized</button>
          </div>
          <span class="result-count" id="result-count"></span>
        </div>

        <div id="materials-list" class="materials-grid">
          <div class="sk-card"><div style="display:flex;gap:12px;align-items:center"><div class="sk sk-icon"></div><div style="flex:1"><div class="sk sk-line w60" style="margin-bottom:8px"></div><div class="sk sk-line w40"></div></div></div><div class="sk sk-line w80"></div><div class="sk sk-line w60"></div></div>
          <div class="sk-card"><div style="display:flex;gap:12px;align-items:center"><div class="sk sk-icon"></div><div style="flex:1"><div class="sk sk-line w60" style="margin-bottom:8px"></div><div class="sk sk-line w40"></div></div></div><div class="sk sk-line w80"></div><div class="sk sk-line w60"></div></div>
          <div class="sk-card"><div style="display:flex;gap:12px;align-items:center"><div class="sk sk-icon"></div><div style="flex:1"><div class="sk sk-line w60" style="margin-bottom:8px"></div><div class="sk sk-line w40"></div></div></div><div class="sk sk-line w80"></div><div class="sk sk-line w60"></div></div>
        </div>
      </div>

      <aside class="upload-col">
        <section class="card" id="upload" aria-labelledby="upload-h">
          <div class="card-head">
            <h2 id="upload-h">Upload material</h2>
          </div>
          <p class="muted" style="margin-bottom:14px">Accepted: .txt, .md, .pdf · max 5MB</p>
          <form id="upload-form">
            <div class="form-group">
              <label for="title">Title <span class="hint">(optional)</span></label>
              <input type="text" id="title" name="title" placeholder="e.g. Chapter 3 - Photosynthesis" />
            </div>
            <div class="form-group">
              <label for="file">File</label>
              <label class="file-drop" id="file-drop" for="file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M20 16v2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-2"/></svg>
                <strong>Choose a file</strong>
                <span class="drop-hint">or drag &amp; drop it here</span>
                <input type="file" id="file" name="file" accept=".txt,.md,.pdf" required />
              </label>
              <p class="file-name" id="file-name"></p>
            </div>
            <button type="submit" class="btn btn-block" id="upload-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M20 16v2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-2"/></svg>
              Upload
            </button>
          </form>
        </section>
      </aside>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/materials.js"></script>
</body>
</html>
